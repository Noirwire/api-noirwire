# The local Supabase stack for this API: Supabase Auth, issuing the
# anonymous sessions the API hands out, and the database with the rewards
# tables (`migrations/`), which the API reaches over the REST interface with
# the secret key and only through SQL functions. No storage is used.
#
# Every port is moved off the Supabase defaults (543xx) so that this stack
# can run next to another local Supabase project.
project_id = "api-noirwire"

[api]
enabled = true
port = 54421
schemas = ["public"]
max_rows = 1

[db]
port = 54422
shadow_port = 54420
major_version = 17

[db.pooler]
enabled = false
port = 54429

[realtime]
enabled = false

[studio]
enabled = false
port = 54423

[local_smtp]
enabled = false
port = 54424

[storage]
enabled = false

[edge_runtime]
enabled = false
inspector_port = 54428

[analytics]
enabled = false
port = 54427

[auth]
enabled = true
site_url = "http://localhost:4000"
# An access token lives an hour. The API refuses the session as a whole once
# it is older than SESSION_MAX_AGE_HOURS, whatever this says.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# No accounts: the API starts anonymous sessions and nothing else.
enable_signup = true
enable_anonymous_sign_ins = true
enable_manual_linking = false

[auth.rate_limit]
# Supabase counts these per address, and the only address it ever sees is
# the API's. So they bound every wallet together and must sit above the
# API's own totals (see docs/deploy.md); the API is what rations callers.
anonymous_users = 600
token_refresh = 6000

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.sms]
enable_signup = false
