name: Bug report
description: Report a problem with the NoirWire API
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not report a vulnerability here. See SECURITY.md.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: The request, the answer you got and the answer you expected. Include steps to reproduce if possible.
    validations:
      required: true

  - type: dropdown
    id: route
    attributes:
      label: Route
      options:
        - Session
        - Solana RPC
        - Jupiter
        - Private payments
        - Fee relayer
        - Prices / history
        - Usage events
        - Docs / OpenAPI
        - Other
    validations:
      required: false

  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Devnet
        - Mainnet
        - Not sure
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Status code, error code and log lines
      description: Never include a session token, a refresh token, a private key or a recovery phrase.
      render: shell
    validations:
      required: false
